name: OID check

on:
  push:
    branches: [ data ]
  pull_request:
    branches: [ data ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: Check the OIDs
      run: |
        python .github/workflows/oids.py
